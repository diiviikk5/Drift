[package]
name = "drift"
version = "2.0.0"
description = "Cinema-grade screen recording with AI-powered zoom"
authors = ["Drift Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
rdev = "0.5"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
image = { version = "0.25", default-features = false, features = ["png"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
dirs-next = "2.0"
cpal = "0.15"
hound = "3.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }
windows-capture = "2.0.1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# Small and fast: whole-program optimization, one codegen unit, no symbols.
# Size-optimized: the heavy work (capture, encoding, rendering) runs in Windows
# and WebView2, so smaller code costs nothing noticeable and loads faster.
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Capture library with Drift's frame-drop fix (see vendor/windows-capture/src/encoder.rs, "Drift patch").
[patch.crates-io]
windows-capture = { path = "vendor/windows-capture" }
